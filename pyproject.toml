[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vera"
version = "1.0.0"
description = "Vera: a local, MCP-gated AI agent that verifies invoices against company records and Dutch VAT rules."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "faker>=30.0",
    "holidays>=0.60",
    "langdetect>=1.0.9",
    "markitdown[pdf,docx,xlsx]>=0.1",
    "mcp>=2.0",
    "nicegui>=2.0",
    "ollama>=0.4",
    "openpyxl>=3.1",
    "pillow>=10.0",
    "pydantic>=2.8",
    "pypdfium2>=4.30",
    "pytesseract>=0.3.10",
    "python-stdnum>=1.20",
    "rapidfuzz>=3.9",
    "reportlab>=4.2",
]

[project.scripts]
vera = "ui.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["agent*", "servers*", "ui*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
